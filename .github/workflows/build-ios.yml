
name: Build Legacy iOS Store (iPhone)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "Files in repository:"
          find . -maxdepth 5 -print
          echo "Searching for Xcode projects:"
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Find project and build
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find . -name "*.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::No .xcodeproj folder found. The project must be uploaded to GitHub."
            exit 1
          fi

          echo "Found project: $PROJECT"

          xcodebuild -list -project "$PROJECT"

          SCHEME=$(xcodebuild -list -json -project "$PROJECT" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-logs
          path: |
            build/Logs/**
          if-no-files-found: ignore
